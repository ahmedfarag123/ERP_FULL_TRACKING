<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Driver Workspace Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tajawal, sans-serif;
        background: linear-gradient(160deg, #11181d, #27333b 55%, #141c21);
        color: #f5f7fa;
      }
      .panel {
        width: min(92vw, 28rem);
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.04);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0;
        color: rgba(245, 247, 250, 0.76);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>You're offline</h1>
      <p>Reconnect to refresh assigned deliveries and sync shipment updates.</p>
    </main>
  </body>
</html>
