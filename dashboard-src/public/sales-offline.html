<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sales Workspace Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top left, rgba(53, 101, 255, 0.34), transparent 24%),
          linear-gradient(150deg, #07101e, #10192d 52%, #09111c);
        color: #f6f7fb;
      }
      .panel {
        width: min(92vw, 30rem);
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0;
        color: rgba(246, 247, 251, 0.78);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>You're offline</h1>
      <p>Reconnect to refresh customers, routes, and delivery coordination updates.</p>
    </main>
  </body>
</html>
